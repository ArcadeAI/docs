settings:
  # Intended supply-chain guard: refuse versions published in the last 7 days (10080 minutes).
  # packageManager is pnpm 10.11.0, which does not implement minimumReleaseAge (added in 10.16.0).
  # This key documents the policy. It does not enforce it. Override pins are the control.
  # This remediation does not upgrade pnpm.
  minimumReleaseAge: 10080

overrides:
  # Force next's transitive postcss to the same safe version as the direct dep in package.json. 8.5.23 fixes the sourceMappingURL arbitrary .map file read (GHSA-6g55-p6wh-862q follow-up). Pinned (not a range) because 8.5.27+ are still inside the 7-day minimumReleaseAge window above.
  postcss: "8.5.26"
  # rule-engine pulls a vulnerable @xmldom/xmldom (XML injection / uncontrolled recursion). 0.9.12 fixes the EntityReference.nodeName fragment injection.
  "@xmldom/xmldom": ">=0.9.12"
  # Force vite's transitive esbuild off the vulnerable dev-server file-read advisory (GHSA-g7r4-m6w7-qqqr)
  esbuild: "0.28.1"
  # Force form-data to a patched version across all transitive dependents (CVE-2026-12143, CRLF header injection)
  form-data: "4.0.6"
  # Force dompurify (via mermaid, posthog-js, swagger-ui-react) past mXSS advisories (CVE-2026-49459, CVE-2026-49458 fixed in 3.4.6; GHSA-76mc-f452-cxcm fixed in 3.4.7). Cap below 4 to stay within consumers' ^3 range.
  dompurify: ">=3.4.13 <4"
  # Force protobufjs (via @opentelemetry/otlp-transformer) past prototype-pollution advisory (CVE-2026-54269, fixed in 7.6.3). Cap below 8 to stay within otlp-transformer's ^7 range.
  protobufjs: ">=7.6.3 <8"
  # Force axios (via @ory/client, @swagger-api/apidom-reference) past the absolute-URL redirect advisory (GHSA-gcfj-64vw-6mp9, fixed in 1.18.0). Cap below 2 to stay within consumers' ^1 range.
  axios: ">=1.19.0 <2"
  # Force brace-expansion (via minimatch) past the recursion and quadratic-expansion advisories
  # (CVE-2026-102276 fixed in 5.0.10, CVE-2026-102278 fixed in 5.0.11, CVE-2026-102277 fixed in 5.0.12).
  # Cap below 6 to stay within minimatch's ^5 range. 5.0.9 still matches the two High ranges.
  brace-expansion: ">=5.0.12 <6"
  # Force seroval (via @tanstack/router-core) past CVE-2026-104846 (GHSA-p6vx-979v-rg4c, fixed in 1.6.2)
  # and CVE-2026-104845 (GHSA-jp82-f5mq-hwhp, fixed in 1.6.3). 1.6.8 was selected manually.
  # 1.6.9 (published 2026-10-09) is still inside the intended 7-day release-age window.
  # pnpm 10.11.0 does not implement minimumReleaseAge, so the setting above would not hold 1.6.9 back.
  # @tanstack/router-core@1.171.15 declares seroval ^1.5.4.
  seroval: "1.6.8"
  # Keep seroval-plugins on the same manually selected 1.6.8 release. router-core imports
  # seroval-plugins/web and declares ^1.5.4. 1.6.9 is inside the intended 7-day window, and
  # pnpm 10.11.0 would not age-gate a range, so this stays an exact pin.
  seroval-plugins: "1.6.8"
  # Force source-map-js (via postcss and @tailwindcss/node) past CVE-2026-93749 (GHSA-68fv-2mgg-jv7q, fixed in 1.2.2).
  # Both parents declare ^1.2.1. 1.2.2 is the only published patched release. The exact pin is retained
  # because pnpm 10.11.0 does not enforce minimumReleaseAge: a range would float to a newer publish
  # the next time the lockfile is regenerated, including one still inside the intended 7-day window.
  source-map-js: "1.2.2"
  # Force sharp (optional dependency of next@16.3.8, range ^0.35.4) past GHSA-wq5f-xc86-pv6w
  # (librsvg CVE-2026-96889, fixed in 0.35.5). 0.35.5 is the latest 0.35.x and stays inside Next's range.
  # The exact pin is retained for the same reason as source-map-js: pnpm 10.11.0 will not age-gate a range.
  # Leave next itself on 16.3.8.
  sharp: "0.35.5"
  # braces@3.0.3 (nextra and the direct fast-glob devDependency -> micromatch@4.0.8) has no published
  # fix for GHSA-vfj7-8cjw-p6xm / CVE-2026-93687. The advisory range is <=3.0.3 and first_patched_version
  # is unset. npm latest is still 3.0.3 (published 2024-05-21). Do not override to an unreleased fork.
  # Force js-yaml (via next-validate-link, swagger-client, swagger-ui-react) past CVE-2026-59869 (fixed in 4.3.0). Cap below 5 to stay within consumers' ^4 range.
  js-yaml: ">=4.3.1 <5"
  # Force @opentelemetry/core (via posthog-js) past the unbounded W3C Baggage allocation advisory (CVE-2026-54285, fixed in 2.8.0). Capped below 2.11.0 because that release is still inside the 7-day minimumReleaseAge window above; raise the cap once it ages out.
  "@opentelemetry/core": ">=2.8.0 <2.11.0"
  # Force mermaid (via @theguild/remark-mermaid, streamdown) past the XY-chart and radar DoS loops, architecture/config prototype pollution, and sibling CSS injection (all fixed in 11.16.1). Cap below 12 to stay within consumers' ^11 range.
  mermaid: ">=11.16.1 <12"
  # Force nanoid (via postcss) past the infinite loops on zero and negative size (fixed in 3.3.18). Cap below 4 to stay within postcss's ^3 range.
  nanoid: ">=3.3.18 <4"
  # Force fflate (via posthog-js) past the unzipSync infinite loop on malformed ZIP64 archives (fixed in 0.4.9). Cap below 0.5 to stay within posthog-js's ^0.4.8 range.
  fflate: ">=0.4.9 <0.5"
  # Force qs (via instantsearch.js) past the array-limit bypass on bracket-key comma parsing (CVE-2026-82562) and the attacker-controlled isBuffer DoS (CVE-2026-82417), both fixed in 6.16.0. Cap below 7 to stay within instantsearch.js's ^6.5.1 range.
  qs: ">=6.16.0 <7"
