name: Update design system dependency
# A toolkit reaches the docs site only when `@arcadeai/design-system` carries
# metadata for it and the pin in this repo is new enough to see that metadata.
# Nothing else in the repo moves that pin, so this runs daily and keeps it at
# most a day behind upstream. The PR it opens is where a human decides whether
# the bump is safe to merge.

on:
  workflow_dispatch:
  # 10:00 UTC, an hour ahead of the 11:00 UTC "Generate toolkit docs" run, so a
  # bump merged promptly is already in place for that day's generation.
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write
  pull-requests: write

# The scheduled run and a manual dispatch both force-push the same
# `automation/update-design-system-dependency` branch, so let one finish before
# the next starts. Not cancel-in-progress: a run cancelled between its test
# gate and PR creation does the work and reports nothing.
concurrency:
  group: update-design-system-dependency

jobs:
  update-design-system:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update @arcadeai/design-system to latest
        run: pnpm install @arcadeai/design-system@latest

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain package.json pnpm-lock.yaml)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run design-system compatibility tests
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          pnpm vitest run toolkit-docs-generator/tests/scripts/sync-toolkit-sidebar.test.ts toolkit-docs-generator/tests/sources/oauth-provider-resolver.test.ts
          pnpm run build

      - name: Get app token
        if: steps.check-changes.outputs.has_changes == 'true'
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.DOCS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_BOT_PRIVATE_KEY }}

      - name: Create pull request
        if: steps.check-changes.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        env:
          HUSKY: 0
          SKIP_HUSKY: 1
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.committer }}
          committer: ${{ steps.app-token.outputs.committer }}
          commit-message: "chore: update @arcadeai/design-system to latest"
          title: "chore: update @arcadeai/design-system to latest"
          body: |
            This PR updates `@arcadeai/design-system` to the latest published version.

            It runs a design-system compatibility test gate before opening this PR.
            If that gate fails, the workflow stops and no PR is created.

            - Trigger: `${{ github.event_name }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          add-paths: |
            package.json
            pnpm-lock.yaml
          branch: automation/update-design-system-dependency
          delete-branch: true

      - name: Request team review
        if: steps.check-changes.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        run: gh pr edit ${{ steps.cpr.outputs.pull-request-number }} --add-reviewer ArcadeAI/engineering-tools-and-dx
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
