name: Generate LLMs.txt

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/en/**/*.mdx"
      - "app/en/**/_meta.tsx"
      - "scripts/generate-llmstxt.ts"
      - "toolkit-docs-generator/data/toolkits/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/en/**/*.mdx"
      - "app/en/**/_meta.tsx"
      - "scripts/generate-llmstxt.ts"
      - "toolkit-docs-generator/data/toolkits/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  llmstxt:
    name: Generate LLMSTXT
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install dependencies
        run: npm install -g pnpm

      - name: Install pnpm
        run: pnpm install

      - name: generate LLMs.txt
        run: pnpm llmstxt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Check for changes
        id: check-changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # GITHUB_TOKEN pushes do not start other workflows. That is acceptable
      # here: Test already ran on the author's commit, and llms.txt is a
      # generated artifact.
      - name: Commit changes to PR
        if: steps.check-changes.outputs.has_changes == 'true' && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/llms.txt
          git commit -m "🤖 Regenerate LLMs.txt"
          git push origin "HEAD:${HEAD_REF}"

      - name: Create Pull Request (for scheduled/manual runs)
        if: steps.check-changes.outputs.has_changes == 'true' && github.event_name != 'pull_request'
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: Regenerate LLMs.txt and related files
          branch: auto-update-llms-txt
          delete-branch: true
          title: "🤖 Regenerate LLMs.txt"
          reviewers: >
            evantahler
            torresmateo

      - name: Request team review
        if: steps.check-changes.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        run: gh pr edit ${{ steps.cpr.outputs.pull-request-number }} --add-reviewer ArcadeAI/engineering-tools-and-dx
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Enable Pull Request Automerge
        if: steps.check-changes.outputs.has_changes == 'true' && github.event_name != 'pull_request' && steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        run: gh pr merge --squash --auto ${{ steps.cpr.outputs.pull-request-number }}
        env:
          GH_TOKEN: ${{ github.token }}
