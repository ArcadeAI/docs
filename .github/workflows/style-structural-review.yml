name: Structural Editorial Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged PR number to review"
        required: true
        type: number
  pull_request:
    types: [closed]
    paths:
      - "content/docs/**/*.md"
      - "content/docs/**/*.mdx"

permissions:
  contents: write
  pull-requests: write

jobs:
  editorial-review:
    name: Editorial Review
    runs-on: ubuntu-latest
    # Only run on merged PRs, skip editorial PRs to prevent loops
    if: |
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true) &&
      !startsWith(github.head_ref || '', 'style/editorial-')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Vale
        run: |
          wget -qO- https://github.com/errata-ai/vale/releases/download/v3.14.2/vale_3.14.2_Linux_64-bit.tar.gz | tar xz -C /usr/local/bin vale

      - name: Sync Vale styles
        run: vale sync

      - name: Run editorial review
        run: bun run vale:editorial --pr ${{ github.event.pull_request.number || inputs.pr_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
