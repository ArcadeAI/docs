name: Refresh Context7 library

# Re-index /arcadeai/docs on Context7 after each main merge.
# Requires CONTEXT7_API_KEY (context7.com/dashboard). Metrics:
# https://context7.com/arcadeai/docs/admin
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  context7:
    name: Refresh Context7 library
    runs-on: ubuntu-latest
    steps:
      - name: Refresh Context7 library
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::error::CONTEXT7_API_KEY is not configured"
            exit 1
          fi

          curl --fail-with-body -sS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/arcadeai/docs"}'
