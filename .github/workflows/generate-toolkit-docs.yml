name: Generate toolkit docs
# Description: Generate toolkit JSON from Engine API, then sync sidebar navigation.
# Flow:
# 1) Generate toolkit JSON into toolkit-docs-generator/data/toolkits
# 2) Sync integrations sidebar _meta.tsx from toolkit-docs-generator/data/toolkits
# 3) Create or update a PR if changes were produced

on:
  repository_dispatch:
    types: [porter_deploy_succeeded]
  workflow_dispatch:
  # 11:00 UTC = 3 AM PST / 4 AM PDT — late enough that DST drift doesn't matter.
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-toolkit-docs
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    # Opt in to Node 24 for JavaScript actions before GitHub forces the
    # switch on 2026-06-02. Harmless today; unblocks the cutover.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate toolkit docs
        # Invoked by path rather than through `pnpm exec`, which would reset the
        # working directory to the repo root and break the relative paths below.
        run: |
          ../node_modules/.bin/tsx src/cli/index.ts generate \
            --all \
            --skip-unchanged \
            --preserve-last-known-good \
            --verbose \
            --api-source tool-metadata \
            --tool-metadata-url "$ENGINE_API_URL" \
            --tool-metadata-key "$ENGINE_API_KEY" \
            --llm-provider anthropic \
            --llm-model "$ANTHROPIC_MODEL" \
            --llm-api-key "$ANTHROPIC_API_KEY" \
            --llm-max-tokens 8192 \
            --llm-editor-provider anthropic \
            --llm-editor-model "$ANTHROPIC_EDITOR_MODEL" \
            --llm-editor-api-key "$ANTHROPIC_API_KEY" \
            --toolkit-concurrency 8 \
            --llm-concurrency 15 \
            --exclude-file ./remove-toolkits.txt \
            --ignore-file ./skip-toolkits.txt \
            --output data/toolkits
        working-directory: toolkit-docs-generator
        env:
          ENGINE_API_URL: ${{ secrets.ENGINE_API_URL }}
          ENGINE_API_KEY: ${{ secrets.ENGINE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          # Stronger model for the secret-coherence editor. Keeps
          # stale-secret cleanup precise instead of re-summarizing the whole
          # artifact.
          ANTHROPIC_EDITOR_MODEL: ${{ secrets.ANTHROPIC_EDITOR_MODEL || 'claude-sonnet-4-6' }}

      - name: Sync toolkit sidebar navigation
        run: pnpm exec tsx toolkit-docs-generator/scripts/sync-toolkit-sidebar.ts --remove-empty-sections=false --verbose

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        env:
          HUSKY: 0
        with:
          token: ${{ secrets.DOCS_PUBLISHABLE_GH_TOKEN }}
          commit-message: "[AUTO] Adding MCP Servers docs update"
          title: "[AUTO] Adding MCP Servers docs update"
          body: |
            This PR was generated after a Porter deploy succeeded.

            - Trigger: ${{ github.event_name }}
            - Deploy env: ${{ github.event.client_payload.env || 'unknown' }}
            - Deploy SHA: ${{ github.event.client_payload.deploy_sha || 'unknown' }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Stable branch so later runs update the open auto-PR instead of
          # opening a new one each time. create-pull-request force-pushes the
          # latest generated docs onto this branch.
          branch: automation/toolkit-docs
          delete-branch: true

      - name: Request team review
        if: steps.cpr.outputs.pull-request-number != ''
        continue-on-error: true
        run: gh pr edit ${{ steps.cpr.outputs.pull-request-number }} --add-reviewer ArcadeAI/engineering-tools-and-dx
        env:
          GH_TOKEN: ${{ secrets.DOCS_PUBLISHABLE_GH_TOKEN }}

      - name: Warn #proj-docs about preserved or omitted toolkit docs
        run: |
          report=toolkit-docs-generator-verification/logs/failed-tools.json
          if [ ! -f "$report" ]; then
            exit 0
          fi

          preserved=$(jq -r '(.preservedToolkits // []) | join(", ")' "$report")
          omitted=$(jq -r '(.omittedToolkits // []) | join(", ")' "$report")
          if [ -z "$preserved" ] && [ -z "$omitted" ]; then
            exit 0
          fi

          payload=$(jq -n \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg preserved "$preserved" \
            --arg omitted "$omitted" \
            '{text: (":warning: Toolkit docs generation completed with recoverable failures\n\n*Workflow run:* <" + $run_url + "|Open run>" + (if $preserved != "" then "\n*Continuing to serve previous docs:* " + $preserved else "" end) + (if $omitted != "" then "\n*No docs are being served (no prior output):* " + $omitted else "" end))}')

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "${{ secrets.SLACK_PROJ_DOCS_WEBHOOK_URL }}"

  alert:
    name: Alert on generation failure
    if: ${{ always() && needs.generate.result == 'failure' }}
    needs: generate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify #proj-docs in Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_PROJ_DOCS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::error::SLACK_PROJ_DOCS_WEBHOOK_URL is not configured"
            exit 1
          fi

          payload=$(jq -n \
            --arg run_url "$RUN_URL" \
            --arg trigger "$TRIGGER" \
            --arg commit "$COMMIT" \
            '{text: (":rotating_light: Toolkit docs generation failed\n\n*Workflow run:* <" + $run_url + "|Open failed run>\n*Trigger:* " + $trigger + "\n*Commit:* " + $commit + "\n\nThe failed run contains the exact file path and validation error.")}')

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
